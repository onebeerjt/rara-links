<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0505">
<title>RARA — Producer / DJ — Miami</title>
<meta name="description" content="RARA — Miami producer/DJ. Afro-leaning dance music, extended sets. Machina Records.">
<style>
/* ===== SHELL: theme switcher (always on top) ===== */
#sw { position: fixed; z-index: 999; left: 0; right: 0; bottom: 0;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  background: rgba(8,8,10,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid rgba(255,255,255,0.1); }
#sw .row { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; max-width: 560px; margin: 0 auto; }
#sw .row::-webkit-scrollbar { display: none; }
#sw button { flex: none; font: 700 10.5px/1 -apple-system, sans-serif; letter-spacing: 0.08em;
  text-transform: uppercase; color: rgba(255,255,255,0.55); background: transparent;
  border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 9px 12px; cursor: pointer; }
#sw button.on { color: #fff; border-color: #fff; background: rgba(255,255,255,0.1); }
#stage { padding-bottom: 76px; }
#theme-css { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<nav id="sw" aria-label="Theme switcher"><div class="row" id="swRow"></div></nav>
<style id="theme-css"></style>
<script>
"use strict";
/* ================= CONFIG (shared by all themes) ================= */
const CONFIG = {
  name: "RARA",
  role: "Producer / DJ — Miami",
  tagline: "Afro-leaning dance music, extended sets, deep cuts. Running Machina Records + Omnisound out of the 305.",
  marquee: ["Machina Records", "Circuit", "Extended sets", "Deep cuts", "Miami", "Vinyl culture"],
  events: [
    { day: "—", mon: "TBA", title: "CIRCUIT", note: "Machina Records' Miami label party. Dates announced on IG.", tag: "Label party" },
    { day: "—", mon: "TBA", title: "DJ sets", note: "Jolene Sound Room + more. Watch the feed for the next date.", tag: "On the decks" }
  ],
  music: [
    { title: "MOVIMIENTO CRIMINAL", sub: "RARA — on Bandcamp", url: "https://machinarecords.bandcamp.com/track/movimiento-criminal", featured: true },
    { title: "Machina Records", sub: "The label — Bandcamp", url: "https://machinarecords.bandcamp.com" },
    { title: "Afro-Centraxx DJ Set", sub: "Miami Community Radio — YouTube", url: "https://www.youtube.com/watch?v=Cv6b3C2QPJo" }
  ],
  socials: [
    { title: "@raravulcain", sub: "Instagram", url: "https://www.instagram.com/raravulcain" },
    { title: "@machinarecs", sub: "Machina Records — Instagram", url: "https://www.instagram.com/machinarecs" },
    { title: "@omnisoundspace", sub: "Omnisound — Instagram", url: "https://www.instagram.com/omnisoundspace" }
  ],
  bookings: { email: "omnisoundslabel@gmail.com", note: "Extended sets. Afro-leaning dance music. Vinyl deep cuts." }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mailto = "mailto:" + CONFIG.bookings.email;

/* ================= THEME ENGINE ================= */
const THEMES = {};
function defineTheme(id, label, theme) { THEMES[id] = Object.assign({ id, label }, theme); }
const ORDER = [];
function setTheme(id) {
  const t = THEMES[id]; if (!t) return;
  document.getElementById("theme-css").textContent = t.css;
  document.body.setAttribute("data-theme", id);
  const stage = document.getElementById("stage");
  stage.innerHTML = t.render();
  document.querySelectorAll("#sw button").forEach(b => b.classList.toggle("on", b.dataset.t === id));
  try { localStorage.setItem("rara-theme", id); } catch (e) {}
  if (t.mount) t.mount(stage);
  window.scrollTo(0, 0);
}
function initSwitcher() {
  const row = document.getElementById("swRow");
  row.innerHTML = ORDER.map(id => `<button data-t="${id}">${esc(THEMES[id].label)}</button>`).join("");
  row.addEventListener("click", e => { const b = e.target.closest("button"); if (b) setTheme(b.dataset.t); });
}
</script>
<script>
/* ============ THEME 1: VOLCANO (original) ============ */
defineTheme("volcano", "Volcano", {
css: `
.t-volcano { --bg:#0a0505; --bg2:#140a08; --card:#181010; --ink:#f5ede6; --muted:rgba(245,237,230,.6);
  --faint:rgba(245,237,230,.36); --lava:#ff4d1c; --lava-deep:#b32a08; --ember:#ff9a3c; --line:rgba(255,77,28,.16);
  background:var(--bg); color:var(--ink); font-family:"Archivo",-apple-system,sans-serif;
  min-height:100dvh; -webkit-font-smoothing:antialiased; }
.t-volcano .grain { position:fixed; inset:0; z-index:60; pointer-events:none; opacity:.09;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
.t-volcano .embers { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.t-volcano .ember { position:absolute; bottom:-20px; border-radius:50%;
  background:radial-gradient(circle,var(--ember) 0%,var(--lava) 40%,transparent 70%);
  opacity:0; animation:vrise linear infinite; }
@keyframes vrise { 0%{transform:translateY(0) translateX(0) scale(1);opacity:0} 8%{opacity:.85}
  100%{transform:translateY(-105vh) translateX(var(--drift,30px)) scale(.3);opacity:0} }
.t-volcano .wrap { max-width:480px; margin:0 auto; padding:0 20px; position:relative; z-index:1; }
.t-volcano .display { font-family:"Bebas Neue","Arial Narrow",sans-serif; letter-spacing:.03em; line-height:.92; }
.t-volcano .hero { padding:44px 0 10px; text-align:center; }
.t-volcano .avatar-ring { width:118px; height:118px; margin:0 auto 18px; border-radius:50%; padding:3px;
  background:conic-gradient(from 0deg,var(--lava),var(--ember),var(--lava-deep),var(--lava));
  animation:vspin 7s linear infinite; box-shadow:0 0 44px rgba(255,77,28,.35); }
@keyframes vspin { to{transform:rotate(360deg)} }
.t-volcano .avatar-ring .init { width:100%; height:100%; border-radius:50%; display:grid; place-items:center;
  background:#1c0d08; border:4px solid var(--bg); font-family:"Bebas Neue",sans-serif; font-size:44px; color:var(--ember); }
.t-volcano .hero h1 { font-size:74px; margin-bottom:2px; }
.t-volcano .hero h1 .volc { color:var(--lava); }
.t-volcano .role { font-size:12px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; color:var(--ember); margin-bottom:12px; }
.t-volcano .tag { font-size:14.5px; line-height:1.6; color:var(--muted); max-width:34ch; margin:0 auto; }
.t-volcano .marquee { margin:26px -20px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  overflow:hidden; white-space:nowrap; padding:11px 0; background:var(--bg2); }
.t-volcano .marquee .track { display:inline-block; animation:vmq 26s linear infinite; }
.t-volcano .marquee span { font-family:"Bebas Neue",sans-serif; font-size:17px; letter-spacing:.16em; color:var(--faint); margin:0 22px; text-transform:uppercase; }
.t-volcano .marquee span b { color:var(--lava); font-weight:400; }
@keyframes vmq { to{transform:translateX(-50%)} }
.t-volcano section { padding:34px 0 4px; }
.t-volcano .eyebrow { font-size:11px; font-weight:700; letter-spacing:.28em; text-transform:uppercase; color:var(--lava);
  margin-bottom:14px; display:flex; align-items:center; gap:10px; }
.t-volcano .eyebrow::after { content:""; flex:1; height:1px; background:var(--line); }
.t-volcano .links { display:grid; gap:12px; }
.t-volcano .link-btn { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
  border-radius:18px; padding:16px 18px; text-decoration:none; color:var(--ink); }
.t-volcano .link-btn:active { transform:scale(.97); }
.t-volcano .link-btn .tx { flex:1; min-width:0; }
.t-volcano .link-btn .tx b { display:block; font-size:15.5px; font-weight:700; }
.t-volcano .link-btn .tx span { font-size:12.5px; color:var(--faint); font-weight:500; }
.t-volcano .link-btn .arr { color:var(--faint); font-size:18px; }
.t-volcano .link-btn.featured { border-color:rgba(255,77,28,.5); box-shadow:0 8px 32px rgba(255,77,28,.18); }
.t-volcano .link-btn.featured .tx b { color:var(--ember); }
.t-volcano .event { display:grid; grid-template-columns:64px 1fr; gap:16px; background:var(--card);
  border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; align-items:center; }
.t-volcano .event .date { text-align:center; border:1px solid rgba(255,77,28,.35); border-radius:14px; padding:10px 4px; background:rgba(255,77,28,.07); }
.t-volcano .event .date b { display:block; font-family:"Bebas Neue",sans-serif; font-size:30px; color:var(--ember); line-height:1; }
.t-volcano .event .date span { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.t-volcano .event h3 { font-size:16.5px; font-weight:800; margin-bottom:3px; }
.t-volcano .event p { font-size:13px; color:var(--muted); line-height:1.5; }
.t-volcano .event .tag { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ember); border:1px solid rgba(255,154,60,.4); padding:3px 9px; border-radius:999px; margin-top:8px; }
.t-volcano .book { border-radius:22px; padding:34px 26px; text-align:center;
  background:linear-gradient(160deg,#241009 0%,var(--card) 65%); border:1px solid rgba(255,77,28,.3); }
.t-volcano .book h2 { font-size:46px; margin-bottom:8px; }
.t-volcano .book p { color:var(--muted); font-size:14px; margin-bottom:20px; }
.t-volcano .book a.mail { display:inline-block; background:linear-gradient(135deg,var(--lava),var(--lava-deep)); color:#fff;
  font-weight:800; font-size:15px; text-decoration:none; padding:15px 30px; border-radius:999px; }
.t-volcano footer { padding:40px 0 36px; text-align:center; }
.t-volcano footer .sig { font-family:"Bebas Neue",sans-serif; font-size:22px; letter-spacing:.06em; color:var(--faint); }
`,
render() {
  const ev = CONFIG.events.map(e => `<div class="event"><div class="date"><b>${esc(e.day)}</b><span>${esc(e.mon)}</span></div>
    <div><h3>${esc(e.title)}</h3><p>${esc(e.note)}</p><span class="tag">${esc(e.tag)}</span></div></div>`).join("");
  const btn = l => `<a class="link-btn${l.featured ? " featured" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">
    <span class="tx"><b>${esc(l.title)}</b><span>${esc(l.sub)}</span></span><span class="arr">↗</span></a>`;
  const seq = CONFIG.marquee.map(w => `<span>${esc(w)} <b>/</b></span>`).join("");
  return `<div class="t-volcano"><div class="grain"></div><div class="embers" id="vEmbers"></div>
    <div class="wrap"><header class="hero"><div class="avatar-ring"><div class="init">R</div></div>
    <h1 class="display">RARA <span class="volc">.</span></h1><div class="role">${esc(CONFIG.role)}</div>
    <p class="tag">${CONFIG.tagline}</p></header></div>
    <div class="marquee"><div class="track">${seq}${seq}</div></div>
    <div class="wrap"><section><div class="eyebrow">Upcoming</div>${ev}</section>
    <section><div class="eyebrow">Music</div><div class="links">${CONFIG.music.map(btn).join("")}</div></section>
    <section><div class="eyebrow">Follow</div><div class="links">${CONFIG.socials.map(btn).join("")}</div></section>
    <section><div class="book"><h2 class="display">BOOK RARA</h2><p>${esc(CONFIG.bookings.note)}</p>
    <a class="mail" href="${mailto}">${esc(CONFIG.bookings.email)}</a></div></section>
    <footer><div class="sig">RARA / MACHINA RECS</div></footer></div></div>`;
},
mount(stage) {
  const box = stage.querySelector("#vEmbers");
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span"); s.className = "ember";
    const sz = 4 + Math.random() * 9;
    s.style.width = s.style.height = sz + "px";
    s.style.left = Math.random() * 100 + "vw";
    s.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
    s.style.animationDuration = (7 + Math.random() * 9) + "s";
    s.style.animationDelay = (Math.random() * 12) + "s";
    box.appendChild(s);
  }
}
});
ORDER.push("volcano");
</script>
<script>
/* ============ THEME 2: DECK (DJ mixer) ============ */
defineTheme("deck", "Deck", {
css: `
.t-deck { --bg:#0b0d10; --panel:#14171c; --ink:#e8ecf1; --mut:#8a94a3; --acc:#00e5a0; --acc2:#ff5c38;
  background:radial-gradient(120% 60% at 50% 0%, #161b22 0%, var(--bg) 60%) fixed, var(--bg);
  color:var(--ink); font-family:-apple-system,"SF Pro Text",sans-serif; min-height:100dvh; }
.t-deck .wrap { max-width:480px; margin:0 auto; padding:0 16px; }
.t-deck .top { padding:40px 0 6px; display:flex; align-items:center; gap:14px; }
.t-deck .platter { width:64px; height:64px; border-radius:50%; flex:none;
  background:conic-gradient(#222 0 10%, #2c313a 10% 20%, #222 20% 30%, #2c313a 30% 40%, #222 40% 50%, #2c313a 50% 60%, #222 60% 70%, #2c313a 70% 80%, #222 80% 90%, #2c313a 90% 100%);
  border:3px solid #2a2f37; position:relative; animation:dspin 4s linear infinite; }
.t-deck .platter::after { content:""; position:absolute; inset:24px; border-radius:50%; background:var(--acc); }
@keyframes dspin { to { transform:rotate(360deg); } }
.t-deck .top h1 { font-size:30px; font-weight:800; letter-spacing:-.02em; }
.t-deck .top p { font-size:12px; color:var(--mut); letter-spacing:.18em; text-transform:uppercase; margin-top:2px; }
.t-deck .strip-label { font-size:10px; font-weight:700; letter-spacing:.22em; color:var(--mut); text-transform:uppercase;
  margin:26px 0 10px; display:flex; align-items:center; gap:8px; }
.t-deck .strip-label::after { content:""; flex:1; height:1px; background:#232830; }
.t-deck .chan { display:block; text-decoration:none; color:var(--ink); background:var(--panel);
  border:1px solid #232830; border-radius:14px; padding:14px 16px; margin-bottom:10px; position:relative; overflow:hidden; }
.t-deck .chan:active { transform:scale(.98); }
.t-deck .chan .row { display:flex; align-items:center; gap:12px; position:relative; z-index:1; }
.t-deck .chan .fader { width:34px; height:52px; flex:none; border-radius:8px; background:#0b0d10; border:1px solid #2a2f37; position:relative; }
.t-deck .chan .fader i { position:absolute; left:5px; right:5px; height:7px; border-radius:4px; background:var(--acc); bottom:8px; }
.t-deck .chan.hot .fader i { background:var(--acc2); }
.t-deck .chan b { display:block; font-size:14.5px; font-weight:700; }
.t-deck .chan span { font-size:12px; color:var(--mut); }
.t-deck .chan .vu { margin-left:auto; display:flex; gap:3px; align-items:flex-end; height:26px; flex:none; }
.t-deck .chan .vu i { width:5px; border-radius:2px; background:#2a2f37; }
.t-deck .chan .vu i.on { background:var(--acc); }
.t-deck .chan .vu i:nth-child(1){height:8px}.t-deck .chan .vu i:nth-child(2){height:14px}
.t-deck .chan .vu i:nth-child(3){height:20px}.t-deck .chan .vu i:nth-child(4){height:26px}
.t-deck .xfade { margin:26px 0 8px; background:var(--panel); border:1px solid #232830; border-radius:14px; padding:16px; }
.t-deck .xfade .bar { height:6px; border-radius:3px; background:linear-gradient(90deg,var(--acc),var(--acc2)); margin:12px 0 4px; position:relative; }
.t-deck .xfade .bar::after { content:""; position:absolute; top:-7px; left:50%; width:20px; height:20px; margin-left:-10px;
  border-radius:6px; background:#e8ecf1; }
.t-deck .xfade a { display:block; text-align:center; color:var(--ink); font-weight:800; font-size:14px; text-decoration:none;
  letter-spacing:.06em; padding:6px; }
.t-deck .xfade small { display:block; text-align:center; color:var(--mut); font-size:12px; }
.t-deck .gig { display:flex; gap:12px; align-items:center; background:var(--panel); border:1px dashed #2f3640;
  border-radius:14px; padding:14px 16px; margin-bottom:10px; }
.t-deck .gig .d { font-weight:800; font-size:13px; color:var(--acc); letter-spacing:.08em; white-space:nowrap; }
.t-deck .gig b { font-size:14px; } .t-deck .gig p { font-size:12px; color:var(--mut); }
`,
render() {
  const chan = (l, hot) => `<a class="chan${hot ? " hot" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">
    <div class="row"><div class="fader"><i></i></div>
    <div><b>${esc(l.title)}</b><span>${esc(l.sub)}</span></div>
    <div class="vu"><i></i><i></i><i></i><i></i></div></div></a>`;
  const gig = e => `<div class="gig"><div class="d">${esc(e.day)}<br>${esc(e.mon)}</div>
    <div><b>${esc(e.title)}</b><p>${esc(e.note)}</p></div></div>`;
  return `<div class="t-deck"><div class="wrap">
    <div class="top"><div class="platter"></div><div><h1>RARA</h1><p>${esc(CONFIG.role)}</p></div></div>
    <div class="strip-label">Live dates</div>${CONFIG.events.map(gig).join("")}
    <div class="strip-label">Channels — tap to play out</div>
    ${CONFIG.music.map((l, i) => chan(l, i === 0)).join("")}
    <div class="strip-label">Follow</div>${CONFIG.socials.map(l => chan(l, false)).join("")}
    <div class="xfade"><div class="strip-label" style="margin:0 0 4px">Bookings — crossfader</div>
      <div class="bar"></div><a href="${mailto}">${esc(CONFIG.bookings.email)}</a>
      <small>${esc(CONFIG.bookings.note)}</small></div>
    <div style="height:24px"></div></div></div>`;
},
mount(stage) {
  stage.querySelectorAll(".vu").forEach((vu, ci) => {
    const bars = vu.querySelectorAll("i");
    setInterval(() => {
      const n = 1 + Math.floor(Math.random() * 4);
      bars.forEach((b, i) => b.classList.toggle("on", i < n));
    }, 380 + ci * 130);
  });
}
});
ORDER.push("deck");
</script>
<script>
/* ============ THEME 3: SETLIST ============ */
defineTheme("setlist", "Setlist", {
css: `
.t-setlist { --paper:#f4efe4; --ink:#1c1a16; --mut:#6f6a5e; --red:#c8352a;
  background:#2b2620; color:var(--ink); font-family:"Courier New",monospace; min-height:100dvh; padding:28px 16px 20px; }
.t-setlist .sheet { max-width:430px; margin:0 auto; background:var(--paper); padding:30px 26px 26px;
  box-shadow:0 18px 50px rgba(0,0,0,.5); transform:rotate(-.6deg); position:relative; }
.t-setlist .sheet::before { content:""; position:absolute; top:-12px; left:50%; width:110px; height:26px;
  transform:translateX(-50%) rotate(2deg); background:rgba(210,200,170,.75); border:1px solid rgba(0,0,0,.08); }
.t-setlist .venue { text-align:center; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:6px; }
.t-setlist .venue h1 { font-size:34px; letter-spacing:.06em; }
.t-setlist .venue p { font-size:12px; color:var(--mut); margin-top:4px; }
.t-setlist .venue .date-line { font-size:11px; letter-spacing:.2em; color:var(--red); font-weight:bold; margin-top:6px; }
.t-setlist ol { list-style:none; margin:14px 0; }
.t-setlist ol li { border-bottom:1px dashed #c9c2b2; }
.t-setlist ol li a { display:flex; gap:12px; align-items:baseline; text-decoration:none; color:var(--ink); padding:11px 2px; }
.t-setlist ol li a:active { background:#e9e2d0; }
.t-setlist .num { font-size:12px; color:var(--mut); width:26px; flex:none; }
.t-setlist .song b { display:block; font-size:15px; letter-spacing:.02em; }
.t-setlist .song span { font-size:11.5px; color:var(--mut); }
.t-setlist .song .star { color:var(--red); font-weight:bold; }
.t-setlist .sec { font-size:11px; letter-spacing:.3em; color:var(--red); font-weight:bold; margin:20px 0 2px; }
.t-setlist .encore { margin-top:18px; border:2px solid var(--ink); padding:16px; text-align:center; transform:rotate(.5deg); }
.t-setlist .encore b { font-size:13px; letter-spacing:.24em; }
.t-setlist .encore a { display:block; color:var(--red); font-weight:bold; font-size:15px; margin-top:8px; text-decoration:underline; }
.t-setlist .encore p { font-size:11.5px; color:var(--mut); margin-top:6px; }
.t-setlist .scribble { font-size:11px; color:var(--mut); font-style:italic; margin-top:16px; text-align:center; }
.t-setlist .gigline { display:flex; gap:10px; padding:9px 2px; border-bottom:1px dashed #c9c2b2; font-size:12.5px; }
.t-setlist .gigline b { color:var(--red); white-space:nowrap; }
`,
render() {
  let n = 0;
  const item = l => { n++; return `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">
    <span class="num">${String(n).padStart(2, "0")}</span>
    <span class="song"><b>${l.featured ? '<span class="star">★ </span>' : ""}${esc(l.title)}</b><span>${esc(l.sub)}</span></span></a></li>`; };
  const gig = e => `<div class="gigline"><b>${esc(e.day)} ${esc(e.mon)}</b><span>${esc(e.title)} — ${esc(e.note)}</span></div>`;
  return `<div class="t-setlist"><div class="sheet">

mount(stage) {

.t-booth .ticker { overflow:hidden; white-space:nowrap; background:#0e0c13; border:1px solid #262330; border-radius:10px;
  margin-top:12px; padding:9px 0; }
.t-booth .ticker span { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--cyn);
  animation:tick 14s linear infinite; padding-left:100%; }
@keyframes tick { to { transform:translateX(-100%); } }
.t-booth .eq { display:flex; gap:4px; align-items:flex-end; height:30px; justify-content:center; margin-top:10px; }
.t-booth .eq i { width:7px; border-radius:3px; background:linear-gradient(180deg,var(--mag),var(--cyn)); animation:eqb 0.9s ease-in-out infinite alternate; }
.t-booth .eq i:nth-child(1){height:40%;animation-delay:0s}.t-booth .eq i:nth-child(2){height:75%;animation-delay:.15s}
.t-booth .eq i:nth-child(3){height:55%;animation-delay:.3s}.t-booth .eq i:nth-child(4){height:90%;animation-delay:.45s}
.t-booth .eq i:nth-child(5){height:65%;animation-delay:.6s}.t-booth .eq i:nth-child(6){height:45%;animation-delay:.75s}
.t-booth .eq i:nth-child(7){height:80%;animation-delay:.9s}
@keyframes eqb { from { transform:scaleY(.4); } to { transform:scaleY(1); } }
.t-booth .pads { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.t-booth .pad { display:block; text-decoration:none; color:var(--ink); background:#17141e; border:1px solid #2e2a3a;
  border-radius:10px; padding:12px 6px; text-align:center; }
.t-booth .pad:active { transform:scale(.94); background:#221d2c; border-color:var(--mag); }
.t-booth .pad b { display:block; font-size:10.5px; font-weight:800; letter-spacing:.04em; line-height:1.3; }
.t-booth .pad span { font-size:9.5px; color:var(--mut); }
.t-booth .pad.hot { border-color:var(--mag); box-shadow:0 0 18px rgba(255,45,120,.25); }
.t-booth .pad.hot b { color:var(--mag); }
.t-booth .socials { display:flex; gap:8px; margin-top:12px; }
.t-booth .soc { flex:1; text-align:center; text-decoration:none; color:var(--ink); font-size:11.5px; font-weight:700;
  background:#17141e; border:1px solid #2e2a3a; border-radius:10px; padding:11px 4px; }
.t-booth .soc:active { transform:scale(.95); }
.t-booth .gigs { margin-top:14px; }
.t-booth .gig { display:flex; gap:12px; align-items:center; padding:11px 4px; border-top:1px solid #1d1a26; font-size:12.5px; }
.t-booth .gig b { color:var(--amb); font-size:11px; letter-spacing:.1em; white-space:nowrap; }
.t-booth .gig span { color:var(--mut); }
.t-booth .book { display:block; margin:18px 0 6px; text-align:center; text-decoration:none; color:#0a0a0a;
  font-weight:900; letter-spacing:.14em; font-size:15px; padding:17px; border-radius:14px;
  background:linear-gradient(135deg,var(--mag),#ff7a3c); box-shadow:0 10px 34px rgba(255,45,120,.35); }
.t-booth .book small { display:block; font-weight:600; letter-spacing:.02em; font-size:11.5px; margin-top:4px; opacity:.75; }
`,
render() {
  const pad = l => `<a class="pad${l.featured ? " hot" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">
    <b>${esc(l.title)}</b><span>${esc(l.sub)}</span></a>`;
  return `<div class="t-booth"><div class="club"></div><div class="wrap">
    <div class="hdr"><span class="live">● LIVE FROM THE BOOTH</span><h1>RARA</h1><p>${esc(CONFIG.role)}</p></div>
    <div class="booth">
      <div class="decks"><div class="deck"><div class="vinyl"></div><div class="dl">DECK A</div></div>
        <div class="deck"><div class="vinyl"></div><div class="dl">DECK B</div></div></div>
      <div class="mixer"><div class="ml">PERFORMANCE PADS — TAP TO PLAY OUT</div>
        <div class="pads">${CONFIG.music.map(pad).join("")}</div>
        <div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="ticker"><span>NOW SPINNING — ${esc(CONFIG.music[0].title)} · ${esc(CONFIG.music[0].sub)} · BOOKINGS OPEN ·</span></div>
        <div class="socials">${CONFIG.socials.map(l => `<a class="soc" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a>`).join("")}</div>
      </div>
    </div>
    <div class="gigs">${CONFIG.events.map(e => `<div class="gig"><b>${esc(e.day)} ${esc(e.mon)}</b><span><strong style="color:var(--ink)">${esc(e.title)}</strong> — ${esc(e.note)}</span></div>`).join("")}</div>
    <a class="book" href="${mailto}">BOOK RARA<small>${esc(CONFIG.bookings.email)}</small></a>
    <div style="height:22px"></div></div></div>`;
}
});
ORDER.push("booth");
</script>
<script>
/* ============ THEME 9: GAMECUBE ============ */
defineTheme("gamecube", "GameCube", {
css: `
.t-gc { --bg:#5b5bb5; --bg2:#4a4a9e; --ink:#fff; --dark:#2e2e6e; --acc:#ffd23f; --grn:#7ee081;

.t-gc .console { background:#6e6ec4; border:4px solid var(--dark); border-radius:26px; padding:20px 16px 18px;

.t-gc .screen h1 .y { color:var(--acc); }
.t-gc .screen p { font-size:11px; letter-spacing:.22em; color:#b9b9e8; margin-top:6px; font-weight:bold; }
.t-gc .screen .tag { font-size:12px; color:#d8d8f5; margin-top:10px; line-height:1.5; }
.t-gc .pad-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
.t-gc .gbtn { display:block; text-decoration:none; color:var(--ink); background:#7d7dd2; border:3px solid var(--dark);

.t-gc .gbtn:active { transform:translateY(4px); box-shadow:0 1px 0 var(--dark); }
.t-gc .gbtn b { display:block; font-size:11px; font-weight:900; letter-spacing:.03em; line-height:1.35; }
.t-gc .gbtn span { font-size:9.5px; color:#d8d8f5; }
.t-gc .gbtn.hot { background:var(--acc); color:var(--dark); }
.t-gc .gbtn.hot span { color:#5a4a10; }
.t-gc .ctl { display:flex; gap:10px; margin-top:14px; align-items:stretch; }
.t-gc .dpad { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.t-gc .dpad a { background:#7d7dd2; border:3px solid var(--dark); border-radius:12px; color:var(--ink);
  text-decoration:none; font-size:10px; font-weight:900; padding:10px 2px; text-align:center; box-shadow:0 4px 0 var(--dark); }
.t-gc .dpad a:active { transform:translateY(3px); box-shadow:none; }
.t-gc .start { flex:none; width:96px; border-radius:50%; background:#ff6b6b; border:4px solid var(--dark); color:#fff;
  font-weight:900; font-size:12px; letter-spacing:.08em; box-shadow:0 6px 0 var(--dark); cursor:pointer;
  display:grid; place-items:center; text-decoration:none; text-align:center; line-height:1.3; padding:8px; }
.t-gc .start:active { transform:translateY(5px); box-shadow:0 1px 0 var(--dark); }
.t-gc .mem { margin-top:16px; background:#101018; border:4px solid var(--dark); border-radius:14px; padding:14px; }
.t-gc .mem .ml { font-size:9px; font-weight:900; letter-spacing:.3em; color:#b9b9e8; margin-bottom:8px; }
.t-gc .mem .slot { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid #26264a; font-size:12px; }
.t-gc .mem .slot b { color:var(--acc); white-space:nowrap; }
.t-gc .mem .slot span { color:#b9b9e8; }
.t-gc .foot { text-align:center; font-size:10px; color:#c9c9ef; letter-spacing:.2em; margin:18px 0 8px; font-weight:bold; }
`,
render() {
  const gbtn = l => `<a class="gbtn${l.featured ? " hot" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">
    <b>${esc(l.title)}</b><span>${esc(l.sub)}</span></a>`;
  return `<div class="t-gc"><div class="wrap"><div class="console">
    <div class="screen"><h1>RARA<span class="y">.</span></h1><p>${esc(CONFIG.role).toUpperCase()}</p>
      <div class="tag">${CONFIG.tagline}</div></div>
    <div class="pad-row">${CONFIG.music.map(gbtn).join("")}</div>

      ${CONFIG.events.map(e => `<div class="slot"><b>${esc(e.day)} ${esc(e.mon)}</b><span>${esc(e.title)} — ${esc(e.note)}</span></div>`).join("")}
      <div class="slot"><b>@</b><span>${esc(CONFIG.bookings.email)}</span></div></div>
  </div><div class="foot">MACHINA RECORDS — PLAYER 1 READY</div></div></div>`;
}
});
ORDER.push("gamecube");
</script>
<script>
/* ============ THEME 10: MACOS ============ */
defineTheme("macos", "macOS", {
css: `
.t-mac { --bg1:#dfe5ee; --bg2:#b8c4d8; --ink:#1d1d1f; --mut:#6e6e73; --acc:#0071e3;
  background:linear-gradient(160deg,var(--bg1),var(--bg2)); color:var(--ink);
  font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif; min-height:100dvh; padding:0 14px 30px; }
.t-mac .menubar { display:flex; gap:16px; align-items:center; padding:9px 16px; margin:0 -14px 22px;
  background:rgba(250,250,252,.72); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  font-size:12.5px; font-weight:600; border-bottom:1px solid rgba(0,0,0,.08); }
.t-mac .menubar .apple { font-size:14px; }

.t-mac .menubar .clock { margin-left:auto; color:var(--mut); font-weight:500; }
.t-mac .win { max-width:440px; margin:0 auto; background:rgba(252,252,254,.82); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-radius:14px; box-shadow:0 30px 80px rgba(30,40,70,.3), 0 0 0 .5px rgba(0,0,0,.12); overflow:hidden; }
.t-mac .titlebar { display:flex; align-items:center; gap:8px; padding:12px 16px;
  background:rgba(240,240,245,.7); border-bottom:1px solid rgba(0,0,0,.08); }
.t-mac .titlebar i { width:12px; height:12px; border-radius:50%; }
.t-mac .titlebar i:nth-child(1){background:#ff5f57}.t-mac .titlebar i:nth-child(2){background:#febc2e}.t-mac .titlebar i:nth-child(3){background:#28c840}
.t-mac .titlebar span { flex:1; text-align:center; font-size:12.5px; font-weight:600; color:var(--mut); }
.t-mac .hero { padding:26px 22px 6px; display:flex; gap:16px; align-items:center; }
.t-mac .ava { width:64px; height:64px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:linear-gradient(135deg,#a8b8d8,#7d8fb5); color:#fff; font-size:26px; font-weight:800; }
.t-mac .hero h1 { font-size:26px; font-weight:700; letter-spacing:-.02em; }
.t-mac .hero p { font-size:12.5px; color:var(--mut); margin-top:2px; }
.t-mac .sec { padding:18px 22px 0; }
.t-mac .sec h2 { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin-bottom:8px; }
.t-mac .row { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink);
  background:rgba(255,255,255,.65); border-radius:12px; padding:12px 14px; margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.06); }
.t-mac .row:active { transform:scale(.98); }
.t-mac .row .ic { width:38px; height:38px; border-radius:10px; flex:none; display:grid; place-items:center;
  background:linear-gradient(135deg,#e8ecf4,#d3dcea); font-weight:800; font-size:14px; color:#4a5a7a; }
.t-mac .row.hot .ic { background:linear-gradient(135deg,#0071e3,#42a5f5); color:#fff; }
.t-mac .row b { display:block; font-size:14px; font-weight:600; }
.t-mac .row span { font-size:12px; color:var(--mut); }
.t-mac .row .chev { margin-left:auto; color:#c7c7cc; font-size:16px; }
.t-mac .gig { display:flex; gap:12px; align-items:center; padding:10px 2px; border-bottom:1px solid rgba(0,0,0,.06); font-size:13px; }
.t-mac .gig .d { font-weight:700; color:var(--acc); white-space:nowrap; font-size:12px; }
.t-mac .dock { margin:20px 12px 12px; background:rgba(240,240,245,.7); border-radius:16px; padding:12px;
  display:flex; gap:10px; align-items:center; }
.t-mac .dock .msg { flex:1; font-size:12.5px; color:var(--mut); }
.t-mac .dock a { flex:none; background:var(--acc); color:#fff; font-weight:700; font-size:13.5px; text-decoration:none;
  padding:11px 20px; border-radius:999px; }
.t-mac .dock a:active { transform:scale(.95); }
`,
render() {
  const art = t => t.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  const row = l => `<a class="row${l.featured ? " hot" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">
    <span class="ic">${art(l.title)}</span>
    <span><b>${esc(l.title)}</b><span>${esc(l.sub)}</span></span><span class="chev">›</span></a>`;
  return `<div class="t-mac">
    <div class="menubar"><span class="apple">●</span><b>RARA</b><span>File</span><span>Edit</span><span>View</span><span class="clock">305 — Miami</span></div>
    <div class="win">
    <div class="titlebar"><i></i><i></i><i></i><span>RARA — link-in-bio</span></div>
    <div class="hero"><div class="ava">R</div><div><h1>RARA</h1><p>${esc(CONFIG.role)}</p></div></div>
    <div class="sec"><h2>Up next</h2>
      ${CONFIG.events.map(e => `<div class="gig"><span class="d">${esc(e.day)} ${esc(e.mon)}</span><span><b>${esc(e.title)}</b> — ${esc(e.note)}</span></div>`).join("")}</div>
    <div class="sec"><h2>Music</h2>${CONFIG.music.map(row).join("")}</div>
    <div class="sec"><h2>Follow</h2>${CONFIG.socials.map(row).join("")}</div>
    <div class="dock"><span class="msg">${esc(CONFIG.bookings.note)}</span><a href="${mailto}">Book</a></div>
  </div></div>`;
}
});
ORDER.push("macos");
</script>
<script>
/* ================= BOOT ================= */
(function () {
  initSwitcher();
  let start = "volcano";
  try { start = localStorage.getItem("rara-theme") || "volcano"; } catch (e) {}
  if (!THEMES[start]) start = "volcano";
  document.title = CONFIG.name + " — " + CONFIG.role;
  setTheme(start);
})();
</script>
</body>
